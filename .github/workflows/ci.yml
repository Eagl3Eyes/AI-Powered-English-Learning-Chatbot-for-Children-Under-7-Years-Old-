name: Production CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    name: Build, Test & Automated Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build Monorepo (Shared, API, Web)
        run: npm run build

      - name: Execute Vitest Unit Test Suite
        run: npm run test

      - name: Run 5-Dimension Automated Evaluation Suite
        run: npm run eval

      - name: Run Real-time Latency Benchmark
        run: npm run benchmark
